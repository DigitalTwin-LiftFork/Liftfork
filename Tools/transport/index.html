<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liftfork 운반 작업</title>
<style>
body{margin:0;background:#f3f6f7;color:#172b39;font:16px "Malgun Gothic",sans-serif}main{max-width:1180px;margin:40px auto;padding:0 24px}h1{font-size:30px}h2{font-size:22px;margin-top:32px}button,select{font:inherit;padding:10px;border:1px solid #a3b7bf;border-radius:4px}button{background:#006e67;color:white;cursor:pointer}button:disabled{background:#819399;cursor:default}label{display:inline-block;margin:8px 16px 8px 0}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #dce4e8}.slots{display:grid;grid-template-columns:repeat(12,minmax(55px,1fr));gap:5px}.slot{padding:10px 4px;border:1px solid #ccd7dc;background:white;text-align:center}.occupied{background:#ead2b3}.reserved{background:#c1e3df}.muted{color:#527080}#message{min-height:24px;color:#a23e1b}small{display:block}
</style><main>
<h1>공장 운반 작업</h1><p id="connection">연결 확인 중</p><p id="loadStatus" role="status"></p>
<p class="muted">입고 구역에서 팔레트를 수동으로 집으세요. 등록한 팔레트가 운반 높이에 도달하면 해당 작업을 배정합니다.</p>
<form id="form"><label>팔레트 <select id="pallet" required></select></label><label>목적지 선반 <select id="destination" required></select></label><button id="submit">운반 등록</button></form>
<p id="message" role="status"></p>
<h2>선반 현황</h2><label>구역 <select id="zone"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></label>
<p class="muted">위에서부터 3층·2층·1층 · 갈색은 사용 중 · 녹색은 작업 예약</p><div class="slots" id="slots"></div>
<h2>작업 목록</h2><table><thead><tr><th>팔레트</th><th>목적지</th><th>상태</th><th>설명</th><th></th></tr></thead><tbody id="jobs"></tbody></table>
<h2>팔레트 위치</h2><table><thead><tr><th>번호</th><th>위치</th></tr></thead><tbody id="inventory"></tbody></table>
</main><script>
const $=id=>document.getElementById(id);
const names={queued:"집기 대기",assigned:"배정",moving:"이동 중",unloading:"하역 중",withdrawing:"포크 회수",completed:"완료",failed:"실패",cancelled:"취소",interrupted:"중단 확인 필요"};
let state={slots:[]};
function jobReason(j){
 if(j.status!=="queued")return j.message;
 if(!state.online)return "Factory 연결을 기다립니다";
 const s=state.snapshot||{};
 if(!s.loaded)return j.pallet+"를 수동으로 집으세요. 포크에 지지된 팔레트가 없습니다.";
 if(s.loaded!==j.pallet)return "현재 적재: "+s.loaded+" · 이 작업은 "+j.pallet+" 집기를 기다립니다.";
 if(state.jobs.some(x=>["assigned","moving","unloading","withdrawing"].includes(x.status)))return "진행 중인 운반 작업 완료를 기다립니다";
 const slot=state.slots.find(x=>x.id===j.destination);
 if(!slot||slot.occupied)return "목적지 선반이 비어 있는지 확인하세요";
 if(!s.ready)return "운반 준비 대기: 포크 높이 15~60cm로 조절하고 기존 자동 동작을 완료하세요";
 return "운반 배정을 기다립니다";
}
function cell(row,text){const td=document.createElement("td");td.textContent=text??"";row.append(td);return td}
function options(el,values){const old=el.value;el.replaceChildren(...values.map(([value,label])=>new Option(label,value)));if(values.some(v=>v[0]===old))el.value=old}
async function post(url,data){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
function renderSlots(){const z=$("zone").value;$("slots").replaceChildren();for(let tier=2;tier>=0;tier--)for(let bay=1;bay<=12;bay++){const id=z+"-"+String(tier*12+bay).padStart(2,"0"),s=state.slots.find(s=>s.id===id);const d=document.createElement("div");d.className="slot"+(s?.occupied?" occupied":s?.reserved_by?" reserved":"");d.textContent=id;d.title=s?.pallet||s?.reserved_by||"비어 있음";$("slots").append(d)}}
async function refresh(){try{const r=await fetch("/api/state");state=await r.json();$("loadStatus").textContent=state.online?("현재 적재: "+(state.snapshot.loaded||"없음")+" · "+(state.snapshot.ready?"운반 준비 완료":"수동 집기 / 운반 준비 대기")):"";$("connection").textContent=state.online?"지게차 연결됨 · "+(state.snapshot.message||"대기"):"지게차 연결 대기 · Factory 플레이를 시작하세요";$("submit").disabled=!state.online;
options($("pallet"),(state.snapshot?.pallets||[]).map(p=>[p.id,p.id+" · "+p.location]));
options($("destination"),state.slots.filter(s=>!s.occupied&&!s.reserved_by).map(s=>[s.id,s.id]));
renderSlots();$("jobs").replaceChildren();for(const j of state.jobs){const tr=document.createElement("tr");cell(tr,j.pallet);cell(tr,j.destination);cell(tr,names[j.status]||j.status);cell(tr,jobReason(j));const td=cell(tr,"");if(!["completed","failed","cancelled","interrupted"].includes(j.status)){const b=document.createElement("button");b.textContent=j.cancel_requested?"취소 요청됨":"취소";b.disabled=!!j.cancel_requested;b.onclick=async()=>{try{await post("/api/jobs/"+j.id+"/cancel",{});await refresh()}catch(e){$("message").textContent=e.message}};td.append(b)}$("jobs").append(tr)}
$("inventory").replaceChildren();for(const p of state.snapshot?.pallets||[]){const tr=document.createElement("tr");cell(tr,p.id);cell(tr,p.location);$("inventory").append(tr)}
}catch(e){$("connection").textContent="서버 연결 끊김";$("submit").disabled=true}}
$("form").onsubmit=async e=>{e.preventDefault();try{await post("/api/jobs",{pallet:$("pallet").value,destination:$("destination").value});$("message").textContent="운반 작업을 등록했습니다";await refresh()}catch(e){$("message").textContent=e.message}};
$("zone").onchange=renderSlots;refresh();setInterval(refresh,1500);
</script></html>
